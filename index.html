<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yazio Clone</title>
  
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

  <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative">
    
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
      <h1 class="text-xl font-bold">Yazio Clone</h1>
      <button onclick="syncDatabase()" id="syncBtn" class="text-sm bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded">Sync DB</button>
    </header>

    <main class="p-4">
      <div id="statusMsg" class="text-sm text-center mb-4 text-gray-500">Checking local cache...</div>

      <div id="scanner-container" class="mb-6 hidden">
        <div id="reader" class="w-full aspect-video bg-black rounded overflow-hidden relative [&>video]:w-full [&>video]:h-full [&>video]:object-cover [&>canvas]:absolute [&>canvas]:top-0 [&>canvas]:left-0 [&>canvas]:w-full [&>canvas]:h-full"></div>
        <button onclick="stopScanner()" class="w-full mt-2 bg-red-500 text-white py-2 rounded shadow">Stop Scanner</button>
      </div>

      <div class="text-center">
        <button onclick="startScanner()" id="startScanBtn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-full shadow-lg w-full mb-6">
          📷 Scan Barcode
        </button>
      </div>

      <div id="result-section" class="hidden bg-blue-50 border border-blue-200 p-4 rounded shadow-sm mb-6">
        <h2 id="res-name" class="text-lg font-bold text-blue-800 mb-2">Product Name</h2>
        <div class="grid grid-cols-4 gap-2 text-center text-sm">
          <div class="bg-white p-2 rounded shadow-sm"><span class="block font-bold text-gray-700" id="res-cal">0</span>Cals</div>
          <div class="bg-white p-2 rounded shadow-sm"><span class="block font-bold text-gray-700" id="res-pro">0</span>Pro</div>
          <div class="bg-white p-2 rounded shadow-sm"><span class="block font-bold text-gray-700" id="res-carb">0</span>Carb</div>
          <div class="bg-white p-2 rounded shadow-sm"><span class="block font-bold text-gray-700" id="res-fat">0</span>Fat</div>
        </div>
      </div>

      <div id="add-form-section" class="hidden bg-gray-50 border border-gray-200 p-4 rounded shadow-sm">
        <h2 class="text-md font-bold mb-3">Product not found. Add it!</h2>
        <p class="text-xs text-gray-500 mb-3">(OCR Integration will go here. For now, enter manually per 100g)</p>
        
        <input type="text" id="new-barcode" readonly class="w-full mb-2 p-2 border rounded bg-gray-200 text-sm">
        <input type="text" id="new-name" placeholder="Product Name" class="w-full mb-2 p-2 border rounded text-sm">
        <div class="grid grid-cols-2 gap-2 mb-4">
          <input type="number" id="new-cal" placeholder="Calories" class="w-full p-2 border rounded text-sm">
          <input type="number" id="new-pro" placeholder="Protein (g)" class="w-full p-2 border rounded text-sm">
          <input type="number" id="new-carb" placeholder="Carbs (g)" class="w-full p-2 border rounded text-sm">
          <input type="number" id="new-fat" placeholder="Fat (g)" class="w-full p-2 border rounded text-sm">
        </div>
        <button onclick="saveNewProduct()" id="saveBtn" class="w-full bg-blue-600 text-white py-2 rounded font-bold">Save to Database</button>
      </div>

    </main>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzzvyJ5OiC-PzDBdvEpPUkvQz9PLK9oR1ex1aIIGS3n7VHlECxfGY_M6jUcYsQcomQM/exec";

    let html5QrcodeScanner;
    let localDB = [];

    // Initialize App
    window.onload = async () => {
      await loadCache();
    };

    async function loadCache() {
      const cachedData = await localforage.getItem('productsDB');
      if (cachedData && cachedData.length > 0) {
        localDB = cachedData;
        document.getElementById('statusMsg').innerText = `Loaded ${localDB.length} products from cache.`;
      } else {
        syncDatabase();
      }
    }

    // UPDATED: Now uses fetch() to talk to GitHub
    async function syncDatabase() {
      document.getElementById('statusMsg').innerText = "Syncing from Google Sheets...";
      document.getElementById('syncBtn').disabled = true;
      
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          redirect: 'follow', // Crucial for Google Apps Script
          headers: {
            "Content-Type": "text/plain;charset=utf-8", // Bypasses the CORS preflight check
          },
          body: JSON.stringify({ action: "getDatabase" })
        });
        const result = await response.json();
        
        if (result.success) {
          localDB = result.data;
          await localforage.setItem('productsDB', result.data);
          document.getElementById('statusMsg').innerText = `Synced! ${result.data.length} products stored.`;
        } else {
          document.getElementById('statusMsg').innerText = "Error syncing: " + result.error;
        }
      } catch (err) {
        document.getElementById('statusMsg').innerText = "Network error syncing DB.";
      }
      document.getElementById('syncBtn').disabled = false;
    }

    // --- Advanced Quagga2 Scanner Logic with Visual Feedback ---
    function startScanner() {
      document.getElementById('scanner-container').classList.remove('hidden');
      document.getElementById('startScanBtn').classList.add('hidden');
      document.getElementById('result-section').classList.add('hidden');
      document.getElementById('add-form-section').classList.add('hidden');

      Quagga.init({
        inputStream: {
          name: "LiveStream",
          type: "LiveStream",
          target: document.querySelector("#reader"),
          constraints: {
            facingMode: "environment",
            width: { ideal: 1280 }, 
            height: { ideal: 720 }
          },
        },
        locator: {
          patchSize: "medium",
          halfSample: true 
        },
        locate: true, 
        numOfWorkers: 2, 
        decoder: {
          readers: ["ean_reader", "ean_8_reader", "upc_reader", "upc_e_reader"]
        }
      }, function(err) {
        if (err) {
          alert("Camera Error: " + err);
          stopScanner();
          return;
        }
        Quagga.start();
      });

      // Track detections and successful scans
      Quagga.onProcessed(onScannerProcessed);
      Quagga.onDetected(onScanSuccess);
    }

    function stopScanner() {
      if (Quagga) {
        Quagga.offProcessed(onScannerProcessed);
        Quagga.offDetected(onScanSuccess);
        Quagga.stop();
        document.getElementById('scanner-container').classList.add('hidden');
        document.getElementById('startScanBtn').classList.remove('hidden');
      }
    }

    // NEW: Draws interactive green boxes over the barcode lines while scanning
    function onScannerProcessed(result) {
      const drawingCtx = Quagga.canvas.ctx.overlay;
      const drawingCanvas = Quagga.canvas.dom.overlay;

      if (result) {
        // Clear previous frame drawings
        if (result.boxes) {
          drawingCtx.clearRect(0, 0, parseInt(drawingCanvas.getAttribute("width")), parseInt(drawingCanvas.getAttribute("height")));
          result.boxes.filter(function (box) {
            return box !== result.box;
          }).forEach(function (box) {
            Quagga.industrial.領 || Quagga.ImageDebug.drawPath(box, { x: 0, y: 1 }, drawingCtx, { color: "green", lineWidth: 2 });
          });
        }

        if (result.box) {
          Quagga.ImageDebug.drawPath(result.box, { x: 0, y: 1 }, drawingCtx, { color: "#00F", lineWidth: 2 });
        }

        if (result.codeResult && result.codeResult.code) {
          Quagga.ImageDebug.drawPath(result.line, { x: 'x', y: 'y' }, drawingCtx, { color: 'red', lineWidth: 3 });
        }
      }
    }

    function onScanSuccess(result) {
      if (result && result.codeResult && result.codeResult.code) {
        const barcode = result.codeResult.code;
        if (barcode.length >= 8) { 
          stopScanner();
          checkDatabase(barcode);
        }
      }
    }

    function stopScanner() {
      if (Quagga) {
        Quagga.offDetected(onScanSuccess); // Remove listener
        Quagga.stop();
        document.getElementById('scanner-container').classList.add('hidden');
        document.getElementById('startScanBtn').classList.remove('hidden');
      }
    }

    // Quagga passes a structured result object
    function onScanSuccess(result) {
      if (result && result.codeResult && result.codeResult.code) {
        const barcode = result.codeResult.code;
        
        // Quagga is highly sensitive; ignore incomplete scans
        if (barcode.length >= 8) { 
          stopScanner();
          checkDatabase(barcode);
        }
      }
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('scanner-container').classList.add('hidden');
          document.getElementById('startScanBtn').classList.remove('hidden');
        }).catch(err => console.error("Failed to stop scanner", err));
      }
    }

    function onScanSuccess(decodedText) {
      stopScanner();
      checkDatabase(decodedText);
    }

    // --- Data Logic ---
    function checkDatabase(barcode) {
      const product = localDB.find(p => p["Barcode"] == barcode);
      
      if (product) {
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('res-name').innerText = product["Product Name"];
        document.getElementById('res-cal').innerText = product["Calories (kcal)"];
        document.getElementById('res-pro').innerText = product["Protein (g)"];
        document.getElementById('res-carb').innerText = product["Carbs (g)"];
        document.getElementById('res-fat').innerText = product["Fat (g)"];
        document.getElementById('statusMsg').innerText = "Product loaded from cache!";
      } else {
        document.getElementById('add-form-section').classList.remove('hidden');
        document.getElementById('new-barcode').value = barcode;
        document.getElementById('statusMsg').innerText = "New barcode detected.";
      }
    }

    // UPDATED: Now uses fetch() to save to Google Sheets
    async function saveNewProduct() {
      const btn = document.getElementById('saveBtn');
      btn.innerText = "Saving...";
      btn.disabled = true;

      const productData = {
        barcode: document.getElementById('new-barcode').value,
        name: document.getElementById('new-name').value,
        calories: document.getElementById('new-cal').value,
        protein: document.getElementById('new-pro').value,
        carbs: document.getElementById('new-carb').value,
        fat: document.getElementById('new-fat').value
      };

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          redirect: 'follow', // Crucial for Google Apps Script
          headers: {
            "Content-Type": "text/plain;charset=utf-8", // Bypasses the CORS preflight check
          },
          body: JSON.stringify({ action: "addProduct", productData: productData })
        });
        const result = await response.json();
        
        if (result.success) {
          btn.innerText = "Saved!";
          document.getElementById('add-form-section').classList.add('hidden');
          syncDatabase(); 
        } else {
          alert("Error: " + result.error);
          btn.innerText = "Save to Database";
          btn.disabled = false;
        }
      } catch (err) {
        alert("Network error saving product.");
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
