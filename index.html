<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yazio Clone</title>
  
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

  <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative">
    
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
      <h1 class="text-xl font-bold">Yazio Clone</h1>
      <button onclick="syncDatabase()" id="syncBtn" class="text-sm bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded">Sync DB</button>
    </header>

    <main class="p-4">
      <div id="statusMsg" class="text-sm text-center mb-4 text-gray-500">Checking local cache...</div>

      <div id="scanner-container" class="mb-6 hidden">
        <div id="reader" class="w-full aspect-video bg-black rounded overflow-hidden relative [&>video]:w-full [&>video]:h-full [&>video]:object-cover [&>canvas]:absolute [&>canvas]:top-0 [&>canvas]:left-0 [&>canvas]:w-full [&>canvas]:h-full"></div>
        <button onclick="stopScanner()" class="w-full mt-2 bg-red-500 text-white py-2 rounded shadow">Stop Scanner</button>
      </div>

      <div class="text-center">
        <button onclick="startScanner()" id="startScanBtn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-full shadow-lg w-full mb-6">
          📷 Scan Barcode
        </button>
      </div>

      <div id="result-section" class="hidden bg-blue-50 border border-blue-200 p-4 rounded shadow-sm mb-6">
        <h2 id="res-name" class="text-lg font-bold text-blue-800 mb-2">Product Name</h2>
        <div class="grid grid-cols-4 gap-2 text-center text-sm">
          <div class="bg-white p-2 rounded shadow-sm"><span class="block font-bold text-gray-700" id="res-cal">0</span>Cals</div>
          <div class="bg-white p-2 rounded shadow-sm"><span class="block font-bold text-gray-700" id="res-pro">0</span>Pro</div>
          <div class="bg-white p-2 rounded shadow-sm"><span class="block font-bold text-gray-700" id="res-carb">0</span>Carb</div>
          <div class="bg-white p-2 rounded shadow-sm"><span class="block font-bold text-gray-700" id="res-fat">0</span>Fat</div>
        </div>
      </div>

      <div id="add-form-section" class="hidden bg-gray-50 border border-gray-200 p-4 rounded shadow-sm">
        <h2 class="text-md font-bold mb-1">Product not found.</h2>
        
        <div class="mb-4">
          <label class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-4 rounded block text-center cursor-pointer shadow">
            📸 Photo of Nutrition Label (100g)
            <input type="file" accept="image/*" capture="environment" id="ocr-file" class="hidden" onchange="runLabelOCR(this)">
          </label>
          <div id="ocrStatus" class="text-xs text-center text-gray-500 mt-1"></div>
        </div>

        <hr class="mb-4">
        
        <input type="text" id="new-barcode" readonly class="w-full mb-2 p-2 border rounded bg-gray-200 text-sm font-mono">
        <input type="text" id="new-name" placeholder="Product Name" class="w-full mb-2 p-2 border rounded text-sm">
        
        <div class="grid grid-cols-2 gap-2 mb-4">
          <div>
            <label class="text-xs text-gray-500">Calories (kcal)</label>
            <input type="number" step="any" id="new-cal" class="w-full p-2 border rounded text-sm">
          </div>
          <div>
            <label class="text-xs text-gray-500">Protein (g)</label>
            <input type="number" step="any" id="new-pro" class="w-full p-2 border rounded text-sm">
          </div>
          <div>
            <label class="text-xs text-gray-500">Carbs (g)</label>
            <input type="number" step="any" id="new-carb" class="w-full p-2 border rounded text-sm">
          </div>
          <div>
            <label class="text-xs text-gray-500">..davon Zucker (g)</label>
            <input type="number" step="any" id="new-zucker" class="w-full p-2 border rounded text-sm">
          </div>
          <div>
            <label class="text-xs text-gray-500">Fat (g)</label>
            <input type="number" step="any" id="new-fat" class="w-full p-2 border rounded text-sm">
          </div>
          <div>
            <label class="text-xs text-gray-500">..gesättigte (g)</label>
            <input type="number" step="any" id="new-gesFat" class="w-full p-2 border rounded text-sm">
          </div>
          <div class="col-span-2">
            <label class="text-xs text-gray-500">Salz / Natrium (g)</label>
            <input type="number" step="any" id="new-salt" class="w-full p-2 border rounded text-sm">
          </div>
        </div>
        <button onclick="saveNewProduct()" id="saveBtn" class="w-full bg-blue-600 text-white py-2 rounded font-bold shadow">Save to Database</button>
      </div>

    </main>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzzvyJ5OiC-PzDBdvEpPUkvQz9PLK9oR1ex1aIIGS3n7VHlECxfGY_M6jUcYsQcomQM/exec";

    let localDB = [];

    let userPin = "";

    window.onload = async () => {
      // Check if the phone already remembers the PIN
      userPin = localStorage.getItem('app_user_pin');
      
      // If not, keep nagging until they enter something
      while (!userPin) {
        userPin = prompt("Enter the Secret Access PIN:");
        if (userPin) {
          localStorage.setItem('app_user_pin', userPin);
        }
      }

      await loadCache();
    };

    async function loadCache() {
      const cachedData = await localforage.getItem('productsDB');
      if (cachedData && cachedData.length > 0) {
        localDB = cachedData;
        document.getElementById('statusMsg').innerText = `Loaded ${localDB.length} products from cache.`;
      } else {
        syncDatabase();
      }
    }

    async function syncDatabase() {
      document.getElementById('statusMsg').innerText = "Syncing from Google Sheets...";
      document.getElementById('syncBtn').disabled = true;
      
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "getDatabase" })
        });
        const result = await response.json();
        
        if (result.success) {
          localDB = result.data;
          await localforage.setItem('productsDB', result.data);
          document.getElementById('statusMsg').innerText = `Synced! ${result.data.length} products stored.`;
        } else {
          document.getElementById('statusMsg').innerText = "Error syncing: " + result.error;
        }
      } catch (err) {
        document.getElementById('statusMsg').innerText = "Network error syncing DB.";
      }
      document.getElementById('syncBtn').disabled = false;
    }

    // --- Scanner Logic ---
    function startScanner() {
      document.getElementById('scanner-container').classList.remove('hidden');
      document.getElementById('startScanBtn').classList.add('hidden');
      document.getElementById('result-section').classList.add('hidden');
      document.getElementById('add-form-section').classList.add('hidden');

      Quagga.init({
        inputStream: {
          name: "LiveStream",
          type: "LiveStream",
          target: document.querySelector("#reader"),
          constraints: {
            facingMode: "environment",
            width: { ideal: 1280 }, 
            height: { ideal: 720 }
          },
        },
        locator: { patchSize: "medium", halfSample: true },
        locate: true, 
        numOfWorkers: 2, 
        decoder: {
          readers: ["ean_reader", "ean_8_reader", "upc_reader", "upc_e_reader"]
        }
      }, function(err) {
        if (err) {
          alert("Camera Error: " + err);
          stopScanner();
          return;
        }
        Quagga.start();
      });

      Quagga.onProcessed(onScannerProcessed);
      Quagga.onDetected(onScanSuccess);
    }

    // FIXED: Now aggressively forces iOS Safari to kill the camera hardware stream
    function stopScanner() {
      if (typeof Quagga !== 'undefined') {
        Quagga.offProcessed(onScannerProcessed);
        Quagga.offDetected(onScanSuccess);
        Quagga.stop();
        
        // Explicitly find the video stream and shut it down down at the hardware level
        const video = document.querySelector("#reader video");
        if (video && video.srcObject) {
          const stream = video.srcObject;
          const tracks = stream.getTracks();
          tracks.forEach(track => track.stop()); // Shuts off phone camera lens
          video.srcObject = null;
        }
        
        // Completely wipe the container HTML to clear out old canvas drawings
        document.getElementById('reader').innerHTML = ""; 

        document.getElementById('scanner-container').classList.add('hidden');
        document.getElementById('startScanBtn').classList.remove('hidden');
      }
    }

    function onScannerProcessed(result) {
      const drawingCtx = Quagga.canvas.ctx.overlay;
      const drawingCanvas = Quagga.canvas.dom.overlay;

      if (result) {
        if (result.boxes) {
          drawingCtx.clearRect(0, 0, parseInt(drawingCanvas.getAttribute("width")), parseInt(drawingCanvas.getAttribute("height")));
          result.boxes.forEach(function (box) {
            if (box !== result.box) {
              Quagga.ImageDebug.drawPath(box, { x: 0, y: 1 }, drawingCtx, { color: "green", lineWidth: 2 });
            }
          });
        }
        if (result.box) {
          Quagga.ImageDebug.drawPath(result.box, { x: 0, y: 1 }, drawingCtx, { color: "#00F", lineWidth: 2 });
        }
        if (result.codeResult && result.codeResult.code) {
          Quagga.ImageDebug.drawPath(result.line, { x: 'x', y: 'y' }, drawingCtx, { color: 'red', lineWidth: 3 });
        }
      }
    }

    function onScanSuccess(result) {
      if (result && result.codeResult && result.codeResult.code) {
        const barcodeString = String(result.codeResult.code).trim();
        
        // Only accept if it's a valid length barcode string
        if (barcodeString && barcodeString.length >= 8 && !barcodeString.includes("[object")) { 
          stopScanner(); // Stops the camera instantly
          checkDatabase(barcodeString); // Checks the database with a clean string
        }
      }
    }

    // --- Data Logic ---
    // FIXED: Defensively sanitizes incoming input to prevent [object Object] rendering
    function checkDatabase(barcodeInput) {
      let barcode = String(barcodeInput).trim();
      
      const product = localDB.find(p => String(p["Barcode"]).trim() === barcode);

      if (product) {
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('res-name').innerText = product["Product Name"];
        document.getElementById('res-cal').innerText = product["Calories (kcal)"];
        document.getElementById('res-pro').innerText = product["Protein (g)"];
        document.getElementById('res-carb').innerText = product["Carbs (g)"];
        document.getElementById('res-fat').innerText = product["Fat (g)"];
        document.getElementById('statusMsg').innerText = "Product loaded from cache!";
      } else {
        document.getElementById('add-form-section').classList.remove('hidden');
        document.getElementById('new-barcode').value = barcode; // Will be a clean number string now
        document.getElementById('statusMsg').innerText = "New barcode detected.";
      }
    }

    // New function handling local file encoding and API execution
    function runLabelOCR(input) {
      const file = input.files[0];
      if (!file) return;

      const status = document.getElementById('ocrStatus');
      status.innerText = "Analyzing nutrition values...";
      status.classList.add('text-orange-600', 'font-bold');

      const reader = new FileReader();
      reader.onload = async function() {
        // Strip out the metadata prefix to leave pure Base64 text data
        const base64Image = reader.result.split(',')[1];

        try {
          const response = await fetch(GAS_URL, {
            method: 'POST',
            redirect: 'follow',
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "runOCR", base64Image: base64Image })
          });
          const result = await response.json();

          if (result.success) {
            // Populate the input fields automatically with parsed numbers
            document.getElementById('new-cal').value = result.macros.calories;
            document.getElementById('new-pro').value = result.macros.protein;
            document.getElementById('new-carb').value = result.macros.carbs;
            document.getElementById('new-zucker').value = result.macros.zucker;
            document.getElementById('new-fat').value = result.macros.fat;
            document.getElementById('new-gesFat').value = result.macros.gesFat;
            document.getElementById('new-salt').value = result.macros.salt;
            status.innerText = "Values successfully extracted! Please verify.";
            status.className = "text-xs text-center text-green-600 font-bold mt-1";
          } else {
            status.innerText = "OCR Failed: " + result.error;
            status.className = "text-xs text-center text-red-500 mt-1";
          }
        } catch (err) {
          status.innerText = "Network failure running OCR processing.";
          status.className = "text-xs text-center text-red-500 mt-1";
        }
      };
      reader.readAsDataURL(file);
    }

    // Updated Save function coordinating expanded dictionary object
    async function saveNewProduct() {
      const btn = document.getElementById('saveBtn');
      btn.innerText = "Saving...";
      btn.disabled = true;

      const productData = {
        barcode: document.getElementById('new-barcode').value,
        name: document.getElementById('new-name').value,
        calories: document.getElementById('new-cal').value,
        protein: document.getElementById('new-pro').value,
        carbs: document.getElementById('new-carb').value,
        zucker: document.getElementById('new-zucker').value,
        fat: document.getElementById('new-fat').value,
        gesFat: document.getElementById('new-gesFat').value,
        salt: document.getElementById('new-salt').value
      };

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "addProduct", productData: productData })
        });
        const result = await response.json();
        
        if (result.success) {
          btn.innerText = "Saved!";
          document.getElementById('add-form-section').classList.add('hidden');
          document.getElementById('ocrStatus').innerText = ""; // Clear status
          syncDatabase(); 
        } else {
          alert("Error: " + result.error);
          btn.innerText = "Save to Database";
          btn.disabled = false;
        }
      } catch (err) {
        alert("Network error saving product.");
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
